# Builds the web app on every push to main and publishes only what is needed to
# run it (the built web app, the server and a minimal package.json) to the
# "deploy" branch. The hosting service follows that branch, so "main" never has
# to contain the generated dist/ folder, and the host never installs the
# development tools.
name: Build deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Publish the deploy branch
        run: |
          node scripts/make-deploy-package.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy
          git rm -r -f -q --cached .
          git add -f dist server shared tsconfig.server.json package.json
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force origin deploy
